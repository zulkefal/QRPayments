# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "55fd096f2902670ee2434f7959236dc0"
application_url = "https://example.com"
embedded = true
name = "QR-BankTransfer"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# A shopper-facing QR needs nothing from the Admin API. read_orders is here
# for order-aware features (dashboard, marking orders paid) and is what a
# merchant expects a payments app to ask for. Add nothing speculatively —
# every extra permission on the install screen costs installs.
scopes = "read_orders"


[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory compliance topics. App Store review rejects submissions without
  # them, and they are what actually erases a merchant's bank details.
  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  topics = [ "customers/data_request" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true
