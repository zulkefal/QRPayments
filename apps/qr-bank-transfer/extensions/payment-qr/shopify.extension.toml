api_version = "2026-07"

[[extensions]]
type = "ui_extension"
name = "Bank transfer QR"
handle = "payment-qr"

  # The thank-you page, not the checkout page. Checkout page extensions need
  # Shopify Plus, which almost no Pakistani merchant has. The total is also
  # final here — shipping and tax are settled — so the amount in the code is
  # exactly what the shopper owes.
  [[extensions.targeting]]
  target = "purchase.thank-you.block.render"
  module = "./src/ThankYou.jsx"

  # The merchant's bank details, saved in the app and published to a shop
  # metafield. Read directly so the page needs no network call.
  [[extensions.metafields]]
  namespace = "$app"
  key = "bank_settings"
