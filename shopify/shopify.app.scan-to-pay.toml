# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0ae04134018844df44768c45958efaec"
name = "Scan To Pay"
application_url = "https://qrpayments-1jx1.onrender.com"
embedded = true

[access_scopes]
# No Admin API scopes. The QR is drawn client-side in the checkout extension,
# and settings publish to an app-owned metafield, which needs no scope. Order
# data is protected customer data — requesting read_orders while nothing uses
# it triggers a data-protection review and reads as an unjustified ask. Add it
# back only when reconciliation actually reads orders server-side.
scopes = ""

[auth]
redirect_urls = [ "https://qrpayments-1jx1.onrender.com/api/auth", "https://qrpayments-1jx1.onrender.com/auth/callback" ]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory compliance endpoints. These are not ordinary subscriptions — they
  # have their own section, and declaring them as topics is rejected outright.
  # shop_deletion_url is what actually erases a merchant's bank details.
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

[build]
automatically_update_urls_on_dev = true
