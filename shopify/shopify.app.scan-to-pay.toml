# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "0ae04134018844df44768c45958efaec"
name = "Scan To Pay"
application_url = "https://example.com"
embedded = true

[access_scopes]
# A shopper-facing QR needs nothing from the Admin API. read_orders is here
# for order-aware features (dashboard, marking orders paid) and is what a
# merchant expects a payments app to ask for. Add nothing speculatively —
# every extra permission on the install screen costs installs.
scopes = "read_orders"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory compliance endpoints. These are not ordinary subscriptions — they
  # have their own section, and declaring them as topics is rejected outright.
  # shop_deletion_url is what actually erases a merchant's bank details.
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

[build]
automatically_update_urls_on_dev = true
