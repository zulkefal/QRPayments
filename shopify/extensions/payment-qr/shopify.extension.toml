api_version = "2026-07"

[[extensions]]
name = "Bank transfer QR"
handle = "payment-qr"
uid = "06663788-861c-29d7-ad35-abfac915ba06fa381bf2"
type = "ui_extension"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.thank-you.block.render"

[extensions.capabilities]
api_access = true

# The merchant's bank details, published to a shop metafield when they save
# settings in the app. Read directly so the page needs no network call.
[[extensions.metafields]]
namespace = "$app"
key = "bank_settings"
